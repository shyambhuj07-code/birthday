<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Riya Babbu!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0008;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .title-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            pointer-events: none;
            max-width: 90%;
        }

        .birthday-text {
            color: #ff66b2;
            font-size: 7vw;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.3;
            text-shadow: 
                0 0 10px #ff007f,
                0 0 20px #ff007f,
                0 0 40px #ff007f,
                0 0 80px #ff007f;
            animation: pulse 1.8s infinite alternate ease-in-out;
        }

        @media (max-width: 600px) {
            .birthday-text {
                font-size: 9vw;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.96);
                opacity: 0.9;
            }
            100% {
                transform: scale(1.04);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <div class="title-container">
        <h1 class="birthday-text">HAPPY BIRTHDAY<br>RIYA BABBU</h1>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const hearts = ['❤️', '💖', '💕', '💗', '💓', '🌸'];
        const fontSize = 20;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        function initDrops() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }
        initDrops();

        function draw() {
            // Dark pink overlay for smooth trailing animation
            ctx.fillStyle = 'rgba(13, 0, 8, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px sans-serif';

            for (let i = 0; i < drops.length; i++) {
                const heart = hearts[Math.floor(Math.random() * hearts.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(heart, x, y);

                if (y > canvas.height && Math.random() > 0.96) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 35);
    </script>
</body>
</html>
